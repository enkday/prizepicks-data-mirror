name: Daily PrizePicks Data Refresh

concurrency:
  group: prizepicks-refresh
  cancel-in-progress: true

permissions:
  contents: write

on:
  # Run every day at 12:00 PM UTC (adjust as needed)
  schedule:
    - cron: '0 12 * * *'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

  # Run on push to main for testing
  push:
    branches: [ main ]

jobs:
  refresh:
    # Avoid an infinite loop: the workflow commits data, which triggers a push event.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Node.js dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify mirror contracts without network calls
        run: npm test

      - name: 🏃 Run PrizePicks scraper
        run: node scraper.js

      - name: 🧩 Build small Action slices
        run: node scripts/build_action_slices.js

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🛠️ Build normalized hierarchy
        run: python3 scripts/build_prizepicks_normalized_v6.py

      - name: 🧩 Build hierarchy slices (connector-safe)
        run: python3 scripts/build_hierarchy_slices.py

      - name: 📊 Check if data changed
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "🤖 Update PrizePicks data - $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: ✅ No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "No changes in scraped data"
